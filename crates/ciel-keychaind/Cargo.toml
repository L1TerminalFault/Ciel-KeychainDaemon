# ==============================================================================
# ciel-keychaind - Main Daemon Binary Manifest
#
# The primary daemon implementing the org.freedesktop.secrets D-Bus interface.
# Manages encrypted storage vaults, cryptographic key derivation, authentication
# sessions, policy controls, PAM IPC, and desktop prompter dialogs.
# ==============================================================================

[package]
name = "ciel-keychaind"
description = "Modern Secret Service daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "ciel-keychaind"
path = "src/main.rs"

[dependencies]
# Shared types (PAM<->daemon wire format, Prompter interface contracts)
ciel-keychaind-proto.workspace = true

# Async runtime & execution primitives
tokio.workspace = true
async-trait.workspace = true
futures-util.workspace = true

# D-Bus Core (FreeDesktop Secret Service implementation)
zbus.workspace = true
zvariant.workspace = true

# Cryptography & Zeroized Memory
argon2.workspace = true
chacha20poly1305.workspace = true
aes.workspace = true
cbc.workspace = true
sha2.workspace = true
num-bigint.workspace = true
rand.workspace = true
zeroize.workspace = true
subtle.workspace = true

# OS Hardening, Process Attributes & Sockets (SO_PEERCRED, mlock, prctl)
nix.workspace = true
libc.workspace = true

# Data Serialization
serde.workspace = true
serde_json.workspace = true

# Diagnostics & Logging
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
hkdf.workspace = true
anyhow.workspace = true
log.workspace = true

[dev-dependencies]
tempfile = "3.10"
